name: Production Deployment

on:
  push:
    branches:
      - production

# ─────────────────────────────────────────────────────────────
# FIX 1 — CONCURRENCY
#
# Two separate groups:
#   • production-build  → cancel superseded builds freely
#   • production-deploy → NEVER cancel; a half-deploy = broken server
#
# Each job declares its own group below. The top-level key is
# intentionally omitted so it doesn't bleed into both jobs.
# ─────────────────────────────────────────────────────────────

env:
  APP_NAME: mango-review
  NODE_VERSION: "22"

jobs:
  # ────────────────────────────────────────────────────────────
  # BUILD
  # Compiles, bundles, and packages everything the server needs.
  # Nothing touches production here — safe to cancel and retry.
  # ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    # Cancel superseded builds — only the latest commit matters.
    concurrency:
      group: production-build
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────
      # NODE
      # ────────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ────────────────────────────────────────────────────────
      # DEBUG — assert structure before any build step touches it
      # ────────────────────────────────────────────────────────
      - name: Verify Repository Structure
        run: |
          echo "=== Working Directory ===" && pwd
          echo "=== Package Files ===" && find . -name package.json -not -path '*/node_modules/*'
          echo "=== Lock Files ===" && find . -name package-lock.json -not -path '*/node_modules/*'

      # ────────────────────────────────────────────────────────
      # BACKEND  (TypeScript → compile)
      # ────────────────────────────────────────────────────────
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend (TypeScript)
        working-directory: backend
        # Outputs compiled JS to backend/dist/
        run: npx tsc

      # ────────────────────────────────────────────────────────
      # FIX 2 — BACKEND NODE_MODULES BUNDLED IN CI
      #
      # Install production deps HERE in CI, not on the server.
      # Eliminates server-time npm registry dependency.
      # Strip devDependencies before packaging.
      # ────────────────────────────────────────────────────────
      - name: Install Backend Production Dependencies
        working-directory: backend
        run: npm ci --omit=dev

      # ────────────────────────────────────────────────────────
      # FRONTEND  (Next.js → standalone build)
      # ────────────────────────────────────────────────────────
      - name: Install Frontend Dependencies
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        # next.config.js must have: output: 'standalone'
        # Standalone bundles its own node_modules — no install needed on server.
        run: npm run build

      # ────────────────────────────────────────────────────────
      # ARTIFACT
      # Packages exactly what the server needs:
      #   backend  → dist/ + node_modules/ (pre-installed, prod-only)
      #   frontend → .next/standalone + .next/static + public/
      #
      # FIX 3 — CHECKSUM
      # sha256sum is generated alongside the tarball so the server
      # can verify integrity before extracting. Corrupt SCP transfers
      # are silent killers without this.
      # ────────────────────────────────────────────────────────
      - name: Create Deployment Artifact
        run: |
          set -euo pipefail

          mkdir -p release/backend
          mkdir -p release/frontend

          # ── Backend ──────────────────────────────────────────
          # Ship compiled output + pre-installed production node_modules.
          # No npm install needed on the server at all.
          cp -r backend/dist         release/backend/dist
          cp -r backend/node_modules release/backend/node_modules
          cp    backend/package.json release/backend/package.json

          # ── Frontend (standalone mode) ────────────────────────
          cp -r frontend/.next/standalone release/frontend/standalone
          cp -r frontend/.next/static     release/frontend/standalone/.next/static
          cp -r frontend/public           release/frontend/standalone/public

          tar -czf release.tar.gz release

          # Generate checksum — uploaded alongside artifact
          sha256sum release.tar.gz > release.tar.gz.sha256
          echo "=== Artifact checksum ===" && cat release.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-release
          path: |
            release.tar.gz
            release.tar.gz.sha256
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # DEPLOY
  #
  # FIX 1 (continued) — deploy gets its OWN concurrency group
  # with cancel-in-progress: FALSE.
  # A cancelled half-deploy leaves the server in an unknown state.
  # If a newer push is queued, this deploy finishes first, then
  # the next build/deploy cycle runs cleanly after.
  # ────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-release

      # ──────────────────────────────────────────────────────────
      # COPY TO SERVER
      # Both the tarball and its checksum are transferred together.
      # ──────────────────────────────────────────────────────────
      - name: Upload Release to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "release.tar.gz,release.tar.gz.sha256"
          target: /tmp

      # ──────────────────────────────────────────────────────────
      # DEPLOY
      # ──────────────────────────────────────────────────────────
      - name: Deploy Release
        uses: appleboy/ssh-action@v1.0.3
        env:
          # ──────────────────────────────────────────────────────
          # FIX 4 — SECRETS PASSED AS ENV VARS, NOT INTERPOLATED STRINGS
          #
          # Interpolating ${{ secrets.X }} directly into shell script
          # strings is a shell-injection vector: if any secret value
          # contains $, !, \, `, or ", the shell interprets them.
          # Passing secrets as SSH environment variables bypasses this
          # entirely — values are received by the shell as literals.
          #
          # Note: appleboy/ssh-action passes `env:` keys via the SSH
          # protocol's environment channel. The remote shell receives
          # them as pre-set variables, never touching a command string.
          # ──────────────────────────────────────────────────────
          SECRET_MONGO_URL: ${{ secrets.MONGO_URL }}
          SECRET_ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          SECRET_REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          SECRET_FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SECRET_FRONTEND_DEV_URL: ${{ secrets.FRONTEND_DEV_URL }}
          SECRET_PRODUCTION_URL1: ${{ secrets.PRODUCTION_URL1 }}
          SECRET_PRODUCTION_URL2: ${{ secrets.PRODUCTION_URL2 }}
          SECRET_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SECRET_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SECRET_GOOGLE_LOGIN_CALLBACK_URL: ${{ secrets.GOOGLE_LOGIN_CALLBACK_URL }}
          SECRET_GOOGLE_MYBUISNESS_CALLBACK_URL: ${{ secrets.GOOGLE_MYBUISNESS_CALLBACK_URL }}
          SECRET_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          SECRET_GMB_BASE_URL: ${{ secrets.GMB_BASE_URL }}
          SECRET_GMB_INFO_URL: ${{ secrets.GMB_INFO_URL }}
          SECRET_GMB_REVIEWS_URL: ${{ secrets.GMB_REVIEWS_URL }}
          SECRET_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          SECRET_RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          SECRET_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SECRET_TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          SECRET_TEST_APP_PASS: ${{ secrets.TEST_APP_PASS }}
          SECRET_CODE: ${{ secrets.CODE }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRET_NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SECRET_NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script_stop: true
          envs: SECRET_MONGO_URL,SECRET_ACCESS_TOKEN_SECRET,SECRET_REFRESH_TOKEN_SECRET,SECRET_FRONTEND_URL,SECRET_FRONTEND_DEV_URL,SECRET_PRODUCTION_URL1,SECRET_PRODUCTION_URL2,SECRET_GOOGLE_CLIENT_ID,SECRET_GOOGLE_CLIENT_SECRET,SECRET_GOOGLE_LOGIN_CALLBACK_URL,SECRET_GOOGLE_MYBUISNESS_CALLBACK_URL,SECRET_GOOGLE_PLACES_API_KEY,SECRET_GMB_BASE_URL,SECRET_GMB_INFO_URL,SECRET_GMB_REVIEWS_URL,SECRET_RAZORPAY_KEY_ID,SECRET_RAZORPAY_KEY_SECRET,SECRET_RAZORPAY_WEBHOOK_SECRET,SECRET_TEST_EMAIL,SECRET_TEST_APP_PASS,SECRET_CODE,SECRET_RESEND_API_KEY,SECRET_NEXT_PUBLIC_API_URL,SECRET_NEXT_PUBLIC_RAZORPAY_KEY_ID
          script: |
            set -Eeuo pipefail

            APP_NAME="mango-review"
            BASE_DIR="$HOME/apps/${APP_NAME}"
            RELEASES_DIR="${BASE_DIR}/releases"
            SHARED_DIR="${BASE_DIR}/shared"
            CURRENT_LINK="${BASE_DIR}/current"

            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            RELEASE_DIR="${RELEASES_DIR}/${TIMESTAMP}"

            mkdir -p "${RELEASES_DIR}"
            mkdir -p "${SHARED_DIR}"

            # Capture previous release BEFORE any mutation — used for rollback.
            PREVIOUS_RELEASE=""
            if [ -L "${CURRENT_LINK}" ]; then
              PREVIOUS_RELEASE=$(readlink -f "${CURRENT_LINK}")
            fi
            echo "Previous release: ${PREVIOUS_RELEASE:-none}"

            ########################################################
            # FIX 5 — NODE VERSION PINNED VIA NVM USE
            #
            # Sourcing nvm.sh activates nvm for this shell session,
            # but doesn't guarantee the right version is active.
            # `nvm use` selects the exact version explicitly, so pm2
            # child processes inherit the correct node binary path.
            ########################################################

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22

            NODE_BIN=$(which node)
            echo "Node: $(node -v) at ${NODE_BIN}  NPM: $(npm -v)"

            ########################################################
            # FIX 3 — CHECKSUM VERIFICATION BEFORE EXTRACTION
            #
            # If the SCP transfer was corrupted, sha256sum fails here
            # and the deploy aborts before touching anything on disk.
            # The rollback trap is not yet armed — server is untouched.
            ########################################################

            echo "=== Verifying artifact integrity ==="
            cd /tmp
            sha256sum -c release.tar.gz.sha256
            echo "Checksum OK ✓"

            ########################################################
            # UNPACK NEW RELEASE
            ########################################################

            mkdir -p "${RELEASE_DIR}"

            tar -xzf /tmp/release.tar.gz \
              -C "${RELEASE_DIR}" \
              --strip-components=1

            # Assert the expected layout is present — fail fast before
            # any process is touched if the tarball structure drifted.
            for required_path in \
              "${RELEASE_DIR}/backend/dist/server.js" \
              "${RELEASE_DIR}/backend/node_modules" \
              "${RELEASE_DIR}/frontend/standalone/server.js" \
              "${RELEASE_DIR}/frontend/standalone/.next/static" \
              "${RELEASE_DIR}/frontend/standalone/public"
            do
              if [ ! -e "${required_path}" ]; then
                echo "FATAL: Expected path missing after unpack: ${required_path}"
                echo "Artifact structure has drifted — aborting before touching server."
                rm -rf "${RELEASE_DIR}"
                exit 1
              fi
            done
            echo "=== Release layout verified ===" && ls "${RELEASE_DIR}"

            ########################################################
            # SHARED ENVIRONMENT FILES
            #
            # FIX 4 (continued) — env vars written from SSH environment
            # variables (SECRET_*), not from shell-interpolated strings.
            # Special characters in secret values are handled safely.
            #
            # FIX 6 — CODE typo corrected.
            # Original had "CODE:=${{ secrets.CODE }}" — the ":=" made
            # the key name "CODE:=" instead of "CODE". Fixed below.
            ########################################################

            # Backend .env — written atomically via temp file then moved
            BACKEND_ENV_TMP="${SHARED_DIR}/.env.backend.tmp"
            cat > "${BACKEND_ENV_TMP}" <<EOF
            PORT=5000
            NODE_ENV=production

            MONGO_URL=${SECRET_MONGO_URL}

            ACCESS_TOKEN_SECRET=${SECRET_ACCESS_TOKEN_SECRET}
            REFRESH_TOKEN_SECRET=${SECRET_REFRESH_TOKEN_SECRET}

            FRONTEND_URL=${SECRET_FRONTEND_URL}
            FRONTEND_DEV_URL=${SECRET_FRONTEND_DEV_URL}
            PRODUCTION_URL1=${SECRET_PRODUCTION_URL1}
            PRODUCTION_URL2=${SECRET_PRODUCTION_URL2}

            GOOGLE_CLIENT_ID=${SECRET_GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${SECRET_GOOGLE_CLIENT_SECRET}
            GOOGLE_LOGIN_CALLBACK_URL=${SECRET_GOOGLE_LOGIN_CALLBACK_URL}
            GOOGLE_MYBUISNESS_CALLBACK_URL=${SECRET_GOOGLE_MYBUISNESS_CALLBACK_URL}
            GOOGLE_PLACES_API_KEY=${SECRET_GOOGLE_PLACES_API_KEY}

            GMB_BASE_URL=${SECRET_GMB_BASE_URL}
            GMB_INFO_URL=${SECRET_GMB_INFO_URL}
            GMB_REVIEWS_URL=${SECRET_GMB_REVIEWS_URL}

            RAZORPAY_KEY_ID=${SECRET_RAZORPAY_KEY_ID}
            RAZORPAY_KEY_SECRET=${SECRET_RAZORPAY_KEY_SECRET}
            RAZORPAY_WEBHOOK_SECRET=${SECRET_RAZORPAY_WEBHOOK_SECRET}

            TEST_EMAIL=${SECRET_TEST_EMAIL}
            TEST_APP_PASS=${SECRET_TEST_APP_PASS}
            CODE=${SECRET_CODE}
            RESEND_API_KEY=${SECRET_RESEND_API_KEY}
            EOF
            # Strip leading whitespace from heredoc indentation
            sed -i 's/^[[:space:]]*//' "${BACKEND_ENV_TMP}"
            mv "${BACKEND_ENV_TMP}" "${SHARED_DIR}/.env"

            # Frontend .env
            FRONTEND_ENV_TMP="${SHARED_DIR}/.env.frontend.tmp"
            cat > "${FRONTEND_ENV_TMP}" <<EOF
            NEXT_PUBLIC_API_URL=${SECRET_NEXT_PUBLIC_API_URL}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${SECRET_NEXT_PUBLIC_RAZORPAY_KEY_ID}
            PORT=3000
            HOSTNAME=0.0.0.0
            EOF
            sed -i 's/^[[:space:]]*//' "${FRONTEND_ENV_TMP}"
            mv "${FRONTEND_ENV_TMP}" "${SHARED_DIR}/.env.frontend"

            # Symlink shared env files into the new release
            ln -sfn "${SHARED_DIR}/.env"         "${RELEASE_DIR}/backend/.env"
            ln -sfn "${SHARED_DIR}/.env.frontend" "${RELEASE_DIR}/frontend/standalone/.env"

            ########################################################
            # ROLLBACK HELPER
            #
            # FIX 7 — ROLLBACK KILLS BROKEN PROCESSES FIRST
            #
            # Original bug: rollback only deleted processes inside the
            # `if [ -f ... ]` guard. A crash-looping new process that
            # passed the file-exists check was never killed before
            # restart — two processes fighting on the same port.
            #
            # Fix: unconditionally kill BOTH processes at the top of
            # rollback() before starting anything. The `|| true` means
            # "don't fail if the process doesn't exist."
            ########################################################

            rollback() {
              local EXIT_CODE=$?
              echo ""
              echo "════════════════════════════════════════════════"
              echo "  DEPLOYMENT FAILED (exit code: ${EXIT_CODE})"
              echo "  Initiating rollback..."
              echo "════════════════════════════════════════════════"

              # Kill whatever is running NOW — healthy or crash-looping.
              # Do this unconditionally before starting anything.
              pm2 delete mango-review-backend  2>/dev/null || true
              pm2 delete mango-review-frontend 2>/dev/null || true

              if [ -n "${PREVIOUS_RELEASE}" ] && [ -d "${PREVIOUS_RELEASE}" ]; then
                echo "Rolling back to: ${PREVIOUS_RELEASE}"
                ln -sfn "${PREVIOUS_RELEASE}" "${CURRENT_LINK}"

                PREV_BACKEND="${PREVIOUS_RELEASE}/backend/dist/server.js"
                PREV_FRONTEND="${PREVIOUS_RELEASE}/frontend/standalone/server.js"

                if [ -f "${PREV_BACKEND}" ]; then
                  pm2 start "${PREV_BACKEND}" \
                    --name mango-review-backend \
                    --cwd  "${PREVIOUS_RELEASE}/backend" \
                    --env  production \
                    --time
                else
                  echo "WARNING: Previous backend entry not found — backend not restored."
                fi

                if [ -f "${PREV_FRONTEND}" ]; then
                  pm2 start "${PREV_FRONTEND}" \
                    --name mango-review-frontend \
                    --cwd  "${PREVIOUS_RELEASE}/frontend/standalone" \
                    --time
                else
                  echo "WARNING: Previous frontend entry not found — frontend not restored."
                fi

                pm2 save
                echo "Rollback complete. Previous release is live."
              else
                echo "CRITICAL: No previous release exists. Server is DOWN."
                echo "Manual intervention required."
              fi

              # Clean up the failed release directory
              rm -rf "${RELEASE_DIR}" 2>/dev/null || true
              rm -f /tmp/release.tar.gz /tmp/release.tar.gz.sha256 2>/dev/null || true
            }

            # Arm the rollback trap — fires on any ERR from this point forward
            trap rollback ERR

            ########################################################
            # START BACKEND
            ########################################################

            BACKEND_ENTRY="${RELEASE_DIR}/backend/dist/server.js"

            if pm2 describe mango-review-backend >/dev/null 2>&1; then
              pm2 delete mango-review-backend
            fi

            pm2 start "${BACKEND_ENTRY}" \
              --name mango-review-backend \
              --cwd  "${RELEASE_DIR}/backend" \
              --env  production \
              --time

            ########################################################
            # START FRONTEND
            ########################################################

            FRONTEND_ENTRY="${RELEASE_DIR}/frontend/standalone/server.js"

            if pm2 describe mango-review-frontend >/dev/null 2>&1; then
              pm2 delete mango-review-frontend
            fi

            pm2 start "${FRONTEND_ENTRY}" \
              --name mango-review-frontend \
              --cwd  "${RELEASE_DIR}/frontend/standalone" \
              --time

            ########################################################
            # FIX 8 — HEALTH CHECKS WITH RETRY LOOP
            #
            # `sleep 8` is a lie — it's cargo-cult waiting.
            # On a cold start, MongoDB connection, or slow instance,
            # 8s may not be enough. A missed window triggers a false
            # rollback, paging someone at 2am for a healthy deploy.
            #
            # Pattern: retry every 3 seconds for up to 45 seconds.
            # First success breaks the loop. Exhausted retries = real failure.
            ########################################################

            echo "Waiting for services to boot..."

            wait_for_service() {
              local URL="$1"
              local NAME="$2"
              local MAX_ATTEMPTS=15   # 15 × 3s = 45s max wait
              local ATTEMPT=0

              while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
                ATTEMPT=$((ATTEMPT + 1))
                if curl -fsS --max-time 5 "${URL}" >/dev/null 2>&1; then
                  echo "${NAME} healthy ✓  (attempt ${ATTEMPT}/${MAX_ATTEMPTS})"
                  return 0
                fi
                echo "${NAME} not ready yet — attempt ${ATTEMPT}/${MAX_ATTEMPTS}, retrying in 3s..."
                sleep 3
              done

              echo "ERROR: ${NAME} failed to become healthy after $((MAX_ATTEMPTS * 3))s"
              return 1
            }

            wait_for_service "http://127.0.0.1:5000/health" "Backend"
            wait_for_service "http://127.0.0.1:3000"        "Frontend"

            # Disarm rollback trap — health checks passed
            trap - ERR

            ########################################################
            # FIX 9 — SYMLINK SWITCHES AFTER HEALTH CHECKS PASS
            #          PM2 SAVE FAILURE IS NOW CAUGHT
            #
            # Original bug: trap was disarmed BEFORE symlink switch
            # and pm2 save. If pm2 save failed, no rollback fired.
            # On next server reboot: pm2 resurrected old release,
            # symlink pointed to new — split-brain.
            #
            # Fix: re-arm a targeted trap that covers just the
            # post-health-check operations. Any failure here triggers
            # a clean rollback.
            ########################################################

            post_switch_rollback() {
              echo "FATAL: Post-switch operation failed. Rolling back symlink."
              ln -sfn "${PREVIOUS_RELEASE}" "${CURRENT_LINK}" 2>/dev/null || true
              pm2 save 2>/dev/null || true
            }
            trap post_switch_rollback ERR

            ln -sfn "${RELEASE_DIR}" "${CURRENT_LINK}"
            echo "Symlink → ${RELEASE_DIR}"

            pm2 save
            echo "PM2 state persisted ✓"

            trap - ERR

            ########################################################
            # PM2 STARTUP — register once, never again
            #
            # FIX 10 — || true is removed from pm2 startup; failures
            # are now logged explicitly. The systemd file check guards
            # against repeated sudo calls on subsequent deploys, which
            # is correct — but silent failure on first registration
            # means the server never auto-restarts after a reboot.
            ########################################################

            if [ ! -f /etc/systemd/system/pm2-ubuntu.service ]; then
              echo "Registering pm2 startup service (first deploy)..."
              NODE_PATH=$(dirname "${NODE_BIN}")
              sudo env PATH="${NODE_PATH}:$PATH" \
                pm2 startup systemd -u ubuntu --hp /home/ubuntu \
                && echo "pm2 startup registered ✓" \
                || echo "WARNING: pm2 startup registration failed — server will not auto-restart after reboot. Run manually: pm2 startup"
            else
              echo "pm2 startup already registered ✓"
            fi

            ########################################################
            # CLEAN OLD RELEASES  (keep last 5)
            # Guard: never delete the release we just made current.
            ########################################################

            find "${RELEASES_DIR}" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              ! -path "${RELEASE_DIR}" \
              | sort -r \
              | tail -n +6 \
              | xargs -r rm -rf

            ########################################################
            # CLEANUP & FINAL STATUS
            ########################################################

            rm -f /tmp/release.tar.gz /tmp/release.tar.gz.sha256

            echo ""
            echo "════════════════════════════════════════════════"
            echo "  DEPLOYMENT SUCCESSFUL"
            echo "  Release: ${TIMESTAMP}"
            echo "  Path:    ${RELEASE_DIR}"
            echo "════════════════════════════════════════════════"
            echo ""

            pm2 status